# Streamlit settings for the prototype web interface (src/app.py).
[client]
toolbarMode = "viewer"   # hide developer menus such as "Deploy"

[browser]
gatherUsageStats = false

[server]
enableStaticServing = true   # serves src/static (fonts) at /app/static

[theme]
primaryColor = "#2d6a64"
backgroundColor = "#f3f5f1"
secondaryBackgroundColor = "#e9ece6"
textColor = "#1f2a2e"
